apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  # ─────────────────────────────────────────────────────────
  # ClusterIP = INTERNAL ONLY.
  # No port is punched through to the host machine.
  # Traefik routes external traffic here via Ingress rule.
  # ─────────────────────────────────────────────────────────
  type: ClusterIP
  selector:
    app: frontend           # Must exactly match deployment label
  ports:
    - port: 80
      targetPort: 80
