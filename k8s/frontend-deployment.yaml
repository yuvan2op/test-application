apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend                 # ⭐ CHANGE APP NAME
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend              # ⭐ CHANGE SAME NAME
  template:
    metadata:
      labels:
        app: frontend            # ⭐ CHANGE SAME NAME
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: frontend         # ⭐ CHANGE
          image: yuvan2op/test-frontend:latest   # ⭐ CHANGE IMAGE
          ports:
            - containerPort: 80                 # ⭐ CHANGE
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
