apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: frontend
          image: yuvan2op/test-frontend:latest
          ports:
            - containerPort: 80

          # ─────────────────────────────────────────────────────────
          # CPU & MEMORY LIMITS
          #
          # Frontend (Nginx serving static files) is very light.
          # Significantly lower than the backend.
          # If you use SSR (e.g. Next.js), raise cpu limit to 500m
          # and memory limit to 512Mi.
          #
          # 50m   = 0.05 vCPU  (static file serving is near-zero CPU)
          # 200m  = 0.2 vCPU   (generous burst ceiling for Nginx)
          # 64Mi  = 64 MiB     (Nginx idle RAM footprint)
          # 128Mi = 128 MiB    (double the request — safe ceiling)
          # ─────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          # ─────────────────────────────────────────────────────────
          # READINESS PROBE
          # Checks root "/" — confirms Nginx is up before routing
          # traffic to this pod.
          # ─────────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          # ─────────────────────────────────────────────────────────
          # LIVENESS PROBE
          # Restarts the container if Nginx stops responding —
          # e.g. a worker process crash or config error.
          # ─────────────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
