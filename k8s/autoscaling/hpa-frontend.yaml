apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    # scale up when avg CPU across pods exceeds 60%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 25       # react fast on spikes
      policies:
        - type: Pods
          value: 2                         # add at most 2 pods per period
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300      # wait 5 min before shrinking
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
          


          