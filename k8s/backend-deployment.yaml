apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-k8sapi
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: test-k8sapi
  template:
    metadata:
      labels:
        app: test-k8sapi
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: test-k8sapi
          image: yuvan2op/test-k8sapi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              value: "mongodb://test-mongo-service:27017/testdb"
            - name: DB_NAME
              value: "testdb"
            - name: JWT_SECRET
              value: "your-secret-key"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000    
            initialDelaySeconds: 5      # Wait 5s after container starts
            periodSeconds: 5            # Re-check every 5s
            failureThreshold: 3         # Mark unready after 3 failures
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15     # Give app full boot time first
            periodSeconds: 10           # Re-check every 10s
            failureThreshold: 3         # Restart after 3 consecutive fails
