apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend                 # ⭐ CHANGE APP NAME HERE
spec:
  replicas: 2                   # production minimum
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend              # ⭐ CHANGE SAME NAME
  template:
    metadata:
      labels:
        app: backend            # ⭐ CHANGE SAME NAME
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend         # ⭐ CHANGE
          image: yuvan2op/test-backend:latest   # ⭐ CHANGE IMAGE
          ports:
            - containerPort: 3000               # ⭐ CHANGE APP PORT
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health     # ⭐ CHANGE if needed
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health     # ⭐ CHANGE if needed
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
