apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.backend.name }}                # ⭐ CHANGE APP NAME HERE
spec:
  replicas: {{ .Values.backend.replicaCount }}                   # production minimum
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}             # ⭐ CHANGE SAME NAME
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}            # ⭐ CHANGE SAME NAME
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: {{ .Values.backend.name }}         # ⭐ CHANGE
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}   # ⭐ CHANGE IMAGE
          ports:
            - containerPort: {{ .Values.backend.containerPort }}               # ⭐ CHANGE APP PORT
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health     # ⭐ CHANGE if needed
              port: {{ .Values.backend.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health     # ⭐ CHANGE if needed
              port: {{ .Values.backend.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
